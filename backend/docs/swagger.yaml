              properties:
                lecture_id:
                  type: string
                  example: LEC-32AEBA14
                class_id:
                  type: number
                  example: 1
                live_id:
                  type: number
                  nullable: true
                  example: 1
                text:
                  type: string
                  example: "오늘 과제 범위가 어디까지인가요?"
                meta:
                  type: object
                  description: 추가 메타데이터 (선택)
