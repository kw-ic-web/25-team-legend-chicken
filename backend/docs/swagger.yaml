        '200':
          description: 리포트 생성 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 분석 리포트가 성공적으로 생성되었습니다.
                  lecture_id:
                    type: string
                    example: LEC-A2787F9D
                  lecture_name:
                    type: string
                    example: 파이썬 프로그래밍
                  class_id:
                    type: number
                    example: 1
