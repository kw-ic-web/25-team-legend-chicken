openapi: 3.0.0
info:
  title: Lec-Q API
  description: Lec-Q 강의 관리 시스템 API 문서
  version: 1.0.0
  contact:
    name: Hyunwoo Park

servers:
  - url: http://localhost:8080
    description: 로컬 개발 서버

tags:
  - name: Auth
    description: 인증 관련 API
  - name: Professor
    description: 교수 관련 API
  - name: Student
    description: 학생 관련 API
  - name: Lectures
    description: 강의 공통 API
  - name: Whiteboard
    description: 실시간 화이트보드 캡처 API
  - name: Questions
    description: 질문 관련 API
  - name: Working
    description: 지금 연결해야하는 API

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 에러 메시지
    
    Class:
      type: object
      properties:
        id:
          type: number
          example: 1
        title:
          type: string
          example: 파이썬 기초
        description:
          type: string
          example: 파이썬 문법과 기본 개념
        date:
          type: string
          format: date-time
          example: 2024-01-15T10:00:00.000Z
        materials:
          type: array
          items:
            type: string
          example: ["https://example.com/python-basic.pdf"]
    
    Reference:
      type: object
      properties:
        title:
          type: string
          example: 파이썬 프로그래밍
        author:
          type: string
          example: 홍길동
        publisher:
          type: string
          example: 한빛미디어
    
    Lecture:
      type: object
      properties:
        lecture_id:
          type: string
          example: LEC-A2787F9D
        name:
          type: string
          example: 파이썬 프로그래밍
        schedule:
          type: string
          example: 월수금 10:00-12:00
        student_count:
          type: number
          example: 30
        professor_name:
          type: string
          example: 홍길동
        professor_email:
          type: string
          example: professor@example.com
        professor_phone:
          type: string
          example: 010-1234-5678
        lecture_description:
          type: string
          example: 파이썬 기초부터 고급까지
        learning_method:
          type: string
          example: 이론 + 실습
        target_audience:
          type: string
          example: 컴퓨터공학 전공자
        references:
          type: array
          items:
            $ref: '#/components/schemas/Reference'
        classes:
          type: array
          items:
            $ref: '#/components/schemas/Class'
        thumbnail:
          type: string
          example: /uploads/images/thumbnail-1234567890-123456789.jpg
        professor_id:
          type: string
        student_id_list:
          type: array
          items:
            type: string

    WhiteboardPage:
      type: object
      properties:
        page_number:
          type: number
          example: 1
        image_path:
          type: string
          example: /uploads/whiteboard/snapshot-1700000000000-123456789.png
        text:
          type: string
          example: "for loop, while loop 정리"
        pdf_path:
          type: string
          example: /uploads/pdfs/whiteboard/whiteboard-LEC-123-CLASS1-p1-1700000000000.pdf
        status:
          type: string
          enum: [draft, finalized]

paths:
  # ==================== 인증 API ====================
  /api/register:
    post:
      tags: [Auth]
      summary: 회원가입
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, user_type]
              properties:
                name:
                  type: string
                  example: 홍길동
                email:
                  type: string
                  format: email
                  example: professor123@test.com
                phone:
                  type: string
                  example: 010-1234-5678
                password:
                  type: string
                  format: password
                  example: test1234
                user_type:
                  type: string
                  enum: [professor, student]
                  example: professor
      responses:
        '201':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 회원가입이 완료되었습니다.
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      name:
                        type: string
                      user_type:
                        type: string
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/login:
    post:
      tags: [Auth]
      summary: 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: professor@test.com
                password:
                  type: string
                  format: password
                  example: test1234
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 로그인 성공!
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      name:
                        type: string
                      user_type:
                        type: string
                  token:
                    type: string
                    description: JWT 토큰
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 존재하지 않는 이메일입니다.

  /api/verify:
    get:
      tags: [Auth]
      summary: 토큰 검증
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 유효한 토큰
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 유효한 토큰입니다.
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      name:
                        type: string
                      user_type:
                        type: string
        '401':
          description: 유효하지 않은 토큰
        '419':
          description: 토큰 만료

  /api/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 로그아웃 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 로그아웃이 완료되었습니다.
        '401':
          description: 인증 토큰이 필요합니다.
        '403':
          description: 유효하지 않은 토큰
        '500':
          description: 서버 오류

  /api/myinfo:
    get:
      tags: [Auth]
      summary: 내 정보 조회
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 내 정보 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      email:
                        type: string
                      phone:
                        type: string
                      user_type:
                        type: string
                      profile_image:
                        type: string
                        example: /uploads/images/profile_image-1234567890-123456789.jpg
        '401':
          description: 인증 토큰이 필요합니다.
        '404':
          description: 사용자를 찾을 수 없습니다.

    put:
      tags: [Auth]
      summary: 내 정보 수정
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: 홍길동
                email:
                  type: string
                  format: email
                  example: professor@test.com
                phone:
                  type: string
                  example: 010-1234-5678
                password:
                  type: string
                  format: password
                  example: newpassword123
                profile_image:
                  type: string
                  format: binary
                  description: 프로필 사진 (jpg, jpeg, png, gif, webp)
      responses:
        '200':
          description: 정보 수정 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 정보가 성공적으로 수정되었습니다.
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      email:
                        type: string
                      phone:
                        type: string
                      user_type:
                        type: string
                      profile_image:
                        type: string
        '401':
          description: 인증 토큰이 필요합니다.
        '404':
          description: 사용자를 찾을 수 없습니다.
        '500':
          description: 서버 오류

  # ==================== 교수 API ====================
  /api/professor/lectures/create:
    post:
      tags: [Professor]
      summary: 강좌 개설
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: 파이썬 프로그래밍
                schedule:
                  type: string
                  example: 월수금 10:00-12:00
                student_count:
                  type: number
                  example: 30
                professor_name:
                  type: string
                  example: 홍길동
                professor_email:
                  type: string
                  example: professor@example.com
                professor_phone:
                  type: string
                  example: 010-1234-5678
                lecture_description:
                  type: string
                  example: 파이썬 기초부터 고급까지
                learning_method:
                  type: string
                  example: 이론 + 실습
                target_audience:
                  type: string
                  example: 컴퓨터공학 전공자
                references:
                  type: string
                  description: JSON 문자열 또는 JSON 배열
                  example: '[{"title":"파이썬 프로그래밍","author":"홍길동","publisher":"한빛미디어"}]'
                classes:
                  type: string
                  description: JSON 문자열 또는 JSON 배열
                  example: '[{"id":1,"title":"파이썬 기초","description":"파이썬 문법과 기본 개념","date":"2024-01-15T10:00:00.000Z","materials":[]}]'
                thumbnail:
                  type: string
                  format: binary
                  description: 강의 썸네일 이미지 (jpg, jpeg, png, gif, webp)
      responses:
        '201':
          description: 강의 개설 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 강의가 성공적으로 개설되었습니다.
                  lecture:
                    $ref: '#/components/schemas/Lecture'
        '403':
          description: 권한 없음
        '500':
          description: 서버 오류

  /api/professor/lectures/search:
    get:
      tags: [Professor]
      summary: 강좌 조회
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 강의 목록 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  lectures:
                    type: array
                    items:
                      $ref: '#/components/schemas/Lecture'
        '403':
          description: 권한 없음

  /api/professor/lectures/{lectureId}/check_member:
    get:
      tags: [Professor]
      summary: 강좌 멤버 조회
      security:
        - bearerAuth: []
      parameters:
        - name: lectureId
          in: path
          required: true
          schema:
            type: string
          example: LEC-D00C967D
      responses:
        '200':
          description: 멤버 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  lecture_id:
                    type: string
                    example: LEC-D00C967D
                  lecture_name:
                    type: string
                    example: 인공지능 기초
                  student_count:
                    type: number
                    example: 0
                  max_students:
                    type: number
                    example: 30
                  students:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        email:
                          type: string
                        phone:
                          type: string
                  invite_link:
                    type: string
                    example: http://localhost:3000/join-lecture/LEC-D00C967D
        '403':
          description: 권한 없음
        '404':
          description: 강좌를 찾을 수 없음

  /api/professor/lectures/{lectureId}/invite_student:
    post:
      tags: [Professor]
      summary: 학생 초대 (이메일)
      security:
        - bearerAuth: []
      parameters:
        - name: lectureId
          in: path
          required: true
          schema:
            type: string
          example: LEC-A1B2C3D4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [student_email]
              properties:
                student_email:
                  type: string
                  format: email
                  example: student@example.com
      responses:
        '200':
          description: 학생 초대 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 학생이 성공적으로 초대되었습니다.
                  student:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      email:
                        type: string
                  current_count:
                    type: number
                    example: 1
                  max_count:
                    type: number
                    example: 30
        '400':
          description: 잘못된 요청
        '403':
          description: 권한 없음
        '404':
          description: 강좌 또는 학생을 찾을 수 없음

  /api/professor/lectures/{lectureId}/classes:
    get:
      tags: [Professor]
      summary: 클래스 목록 조회
      security:
        - bearerAuth: []
      parameters:
        - name: lectureId
          in: path
          required: true
          schema:
            type: string
          example: LEC-A2787F9D
      responses:
        '200':
          description: 클래스 목록 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  lecture_id:
                    type: string
                  lecture_name:
                    type: string
                  classes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Class'
        '403':
          description: 권한 없음
        '404':
          description: 강좌를 찾을 수 없음

    put:
      tags: [Professor]
      summary: 클래스 수정
      security:
        - bearerAuth: []
      parameters:
        - name: lectureId
          in: path
          required: true
          schema:
            type: string
          example: LEC-A2787F9D
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classes]
              properties:
                classes:
                  type: array
                  items:
                    $ref: '#/components/schemas/Class'
                  example:
                    - id: 1
                      title: 파이썬 기초 (수정됨)
                      description: 파이썬 문법과 기본 개념 - 업데이트
                      date: 2024-01-15T10:00:00Z
                      materials: ["https://example.com/python-basic-v2.pdf"]
                    - id: 2
                      title: 반복문과 리스트
                      description: for, while 반복문과 리스트 조작
                      date: 2024-01-17T10:00:00Z
                      materials: ["https://example.com/loops-lists.pdf"]
      responses:
        '200':
          description: 클래스 수정 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 클래스가 성공적으로 수정되었습니다.
                  lecture_id:
                    type: string
                  classes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Class'
        '400':
          description: 잘못된 요청
        '403':
          description: 권한 없음
        '404':
          description: 강좌를 찾을 수 없음

  /api/professor/lectures/{lectureId}/classes/{classId}:
    get:
      tags: [Professor]
      summary: 특정 클래스 정보 조회
      security:
        - bearerAuth: []
      parameters:
        - name: lectureId
          in: path
          required: true
          schema:
            type: string
          example: LEC-A2787F9D
        - name: classId
          in: path
          required: true
          schema:
            type: number
          example: 1
      responses:
        '200':
          description: 클래스 정보 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  lecture_id:
                    type: string
                    example: LEC-A2787F9D
                  lecture_name:
                    type: string
                    example: 파이썬 프로그래밍
                  class:
                    $ref: '#/components/schemas/Class'
        '403':
          description: 권한 없음
        '404':
          description: 강좌 또는 클래스를 찾을 수 없음

  /api/professor/lectures/{lectureId}/classes/{classId}/pdf:
    get:
      tags: [Professor]
      summary: 특정 클래스의 PDF 목록 조회
      security:
        - bearerAuth: []
      parameters:
        - name: lectureId
          in: path
          required: true
          schema:
            type: string
          example: LEC-A2787F9D
        - name: classId
          in: path
          required: true
          schema:
            type: number
          example: 1
      responses:
        '200':
          description: PDF 목록 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  lecture_id:
                    type: string
                    example: LEC-A2787F9D
                  lecture_name:
                    type: string
                    example: 파이썬 프로그래밍
                  class_id:
                    type: number
                    example: 1
                  class_title:
                    type: string
                    example: 파이썬 기초
                  pdf_count:
                    type: number
                    example: 2
                  pdfs:
                    type: array
                    items:
                      type: string
                    example:
                      - "https://example.com/python-basic.pdf"
                      - "/uploads/pdfs/pdf-1760116004480-592477653.pdf"
        '403':
          description: 권한 없음
        '404':
          description: 강좌 또는 클래스를 찾을 수 없음

  /api/professor/lectures/{lectureId}/classes/{classId}/uploadpdf:
    post:
      tags: [Professor]
      summary: PDF 업로드
      security:
        - bearerAuth: []
      parameters:
        - name: lectureId
          in: path
          required: true
          schema:
            type: string
          example: LEC-A2787F9D
        - name: classId
          in: path
          required: true
          schema:
            type: string
          example: 1
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                pdf:
                  type: string
                  format: binary
      responses:
        '200':
          description: PDF 업로드 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: PDF가 성공적으로 업로드되었습니다.
                  lecture_id:
                    type: string
                  class_id:
                    type: number
                  class_title:
                    type: string
                  pdf_url:
                    type: string
                  filename:
                    type: string
                  materials:
                    type: array
                    items:
                      type: string
        '400':
          description: 잘못된 요청
        '403':
          description: 권한 없음
        '404':
          description: 강좌 또는 클래스를 찾을 수 없음

  # ==================== 화이트보드 API ====================
  /api/lectures/{lectureId}/classes/{classId}/whiteboard/snapshot:
    post:
      tags: [Whiteboard]
      summary: 화이트보드 스냅샷 업로드
      description: >
        강의자의 필기 화면 스냅샷을 업로드하여 Cloud Vision을 이용해 텍스트를 분석하고
        페이지 변경 또는 필기 삭제를 감지합니다.
        <br/> - 유사도가 높으면 현재 페이지를 업데이트합니다.
        <br/> - 유사도가 낮거나 텍스트가 크게 줄어들면 이전 페이지를 PDF로 저장하고 새로운 페이지를 시작합니다.
      security:
        - bearerAuth: []
      parameters:
        - name: lectureId
          in: path
          required: true
          schema:
            type: string
          example: LEC-A2787F9D
        - name: classId
          in: path
          required: true
          schema:
            type: string
          example: CLASS-01
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [snapshot]
              properties:
                snapshot:
                  type: string
                  format: binary
                  description: 화이트보드 화면 캡처 이미지 (jpg, jpeg, png, gif, webp)
      responses:
        '200':
          description: 스냅샷 처리 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  action:
                    type: string
                    description: 처리 결과 (draft_created, draft_updated, finalized_and_new_draft)
                    example: draft_updated
                  page:
                    $ref: '#/components/schemas/WhiteboardPage'
                  finalized_page:
                    $ref: '#/components/schemas/WhiteboardPage'
                  draft_page:
                    $ref: '#/components/schemas/WhiteboardPage'
        '201':
          description: 새 페이지 초안 생성
        '400':
          description: 잘못된 요청 (이미지 미업로드 등)
        '401':
          description: 인증 토큰이 필요합니다.
        '403':
          description: 교수만 업로드 가능
        '500':
          description: 서버 오류

  /api/professor/lectures/{lectureId}/classes/{classId}/report:
    get:
      tags: [Professor]
      summary: 분석 리포트 생성 (GPT 활용)
      description: 가상의 학생 질문 데이터를 기반으로 GPT가 강의 분석 리포트를 생성합니다.
      security:
        - bearerAuth: []
      parameters:
        - name: lectureId
          in: path
          required: true
          schema:
            type: string
          example: LEC-A2787F9D
        - name: classId
          in: path
          required: true
          schema:
            type: number
          example: 1
      responses:
        '200':
          description: 리포트 생성 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 분석 리포트가 성공적으로 생성되었습니다.
                  lecture_id:
                    type: string
                    example: LEC-A2787F9D
                  lecture_name:
                    type: string
                    example: 파이썬 프로그래밍
                  class_id:
                    type: number
                    example: 1
                  class_title:
                    type: string
                    example: 파이썬 기초
                  generated_at:
                    type: string
                    format: date-time
                    example: 2024-01-15T10:00:00.000Z
                  analysis_period:
                    type: object
                    properties:
                      start_date:
                        type: string
                        format: date-time
                      end_date:
                        type: string
                        format: date-time
                  student_count:
                    type: number
                    example: 30
                  questions_analyzed:
                    type: number
                    example: 4
                  questions:
                    type: array
                    items:
                      type: object
                      properties:
                        student_name:
                          type: string
                          example: 김학생
                        question:
                          type: string
                          example: 파이썬 기초에 대해 제가 이해한 게 맞는지 확인하고 싶습니다.
                        timestamp:
                          type: string
                          format: date-time
                  report:
                    type: object
                    properties:
                      summary:
                        type: string
                        description: GPT가 생성한 상세한 분석 리포트 내용
                        example: |
                          1. 질문 분석 요약
                          - 학생들의 질문 패턴을 분석한 결과...
                          
                          2. 학습 이해도 평가
                          - 전반적인 이해도는 중상 수준...
                          
                          3. 개선 제안
                          - 추가 자료 제공 권장...
                          
                          4. 다음 주차 준비 사항
                          - 실습 예제를 미리 준비...
                      sections:
                        type: object
                        properties:
                          question_analysis:
                            type: string
                            example: 질문 분석 요약이 포함되어 있습니다.
                          understanding_level:
                            type: string
                            example: 학습 이해도 평가가 포함되어 있습니다.
                          improvement_suggestions:
                            type: string
                            example: 개선 제안이 포함되어 있습니다.
                          next_week_preparation:
                            type: string
                            example: 다음 주차 준비 사항이 포함되어 있습니다.
        '403':
          description: 권한 없음 (교수만 가능)
        '404':
          description: 강좌 또는 클래스를 찾을 수 없음
        '500':
          description: 서버 오류 또는 OpenAI API 오류

  # ==================== 학생 API ====================
  /api/student/join-lecture/{lectureId}:
    post:
      tags: [Student]
      summary: 강좌 참가 (링크를 통해)
      security:
        - bearerAuth: []
      parameters:
        - name: lectureId
          in: path
          required: true
          schema:
            type: string
          example: LEC-D00C967D
      responses:
        '200':
          description: 강좌 참가 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 강좌에 성공적으로 참가했습니다.
                  lecture:
                    type: object
                    properties:
                      lecture_id:
                        type: string
                      name:
                        type: string
                      schedule:
                        type: string
                      professor_name:
                        type: string
                      professor_email:
                        type: string
                  current_count:
                    type: number
                  max_count:
                    type: number
        '400':
          description: 잘못된 요청 (이미 등록됨 또는 인원 초과)
        '403':
          description: 권한 없음 (학생만 가능)
        '404':
          description: 강좌를 찾을 수 없음

  /api/student/my-lectures:
    get:
      tags: [Student]
      summary: 내 강의 목록 조회
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 강의 목록 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  student_name:
                    type: string
                  student_email:
                    type: string
                  lecture_count:
                    type: number
                  lectures:
                    type: array
                    items:
                      type: object
                      properties:
                        lecture_id:
                          type: string
                        name:
                          type: string
                        schedule:
                          type: string
                        professor_name:
                          type: string
                        professor_email:
                          type: string
                        professor_phone:
                          type: string
                        lecture_description:
                          type: string
        '403':
          description: 권한 없음 (학생만 가능)

  /api/student/leave-lecture/{lectureId}:
    delete:
      tags: [Student]
      summary: 강좌 나가기
      security:
        - bearerAuth: []
      parameters:
        - name: lectureId
          in: path
          required: true
          schema:
            type: string
          example: LEC-D00C967D
      responses:
        '200':
          description: 강좌 나가기 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 강좌에서 성공적으로 나갔습니다.
                  lecture_name:
                    type: string
        '400':
          description: 잘못된 요청 (등록되지 않은 강좌)
        '403':
          description: 권한 없음 (학생만 가능)
        '404':
          description: 강좌를 찾을 수 없음

  # ==================== 질문 API ====================
  /api/questions/lectures/{lectureId}/classes/{classId}:
    get:
      tags: [Questions]
      summary: 클래스 단위 질문 조회
      description: 특정 강좌의 특정 클래스에 등록된 모든 질문을 조회합니다.
      security:
        - bearerAuth: []
      parameters:
        - name: lectureId
          in: path
          required: true
          schema:
            type: string
          example: LEC-4CDC64C1
        - name: classId
          in: path
          required: true
          schema:
            type: number
          example: 1
        - name: page
          in: query
          required: false
          schema:
            type: number
          description: 특정 페이지의 질문만 조회 (선택)
          example: 3
        - name: limit
          in: query
          required: false
          schema:
            type: number
            default: 50
            maximum: 200
          description: 조회할 질문 개수 (최대 200개)
          example: 50
      responses:
        '200':
          description: 질문 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  lecture_id:
                    type: string
                    example: LEC-4CDC64C1
                  class_id:
                    type: number
                    example: 1
                  count:
                    type: number
                    example: 5
                  questions:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                          example: 6914001daba488eae7586b8f
                        lecture_id:
                          type: string
                          example: LEC-4CDC64C1
                        class_id:
                          type: number
                          example: 1
                        live_id:
                          type: number
                          nullable: true
                          example: null
                        page:
                          type: number
                          example: 3
                        section:
                          type: string
                          nullable: true
                          example: A
                        position:
                          type: object
                          properties:
                            x:
                              type: number
                              example: 0.12
                            y:
                              type: number
                              example: 0.34
                        timestamp:
                          type: string
                          format: date-time
                          example: 2025-11-12T03:33:49.966Z
                        type:
                          type: string
                          enum: [question, answer, note]
                          example: question
                        author:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
                        text:
                          type: string
                          example: 질문 본문입니다
                        metadata:
                          type: object
                        created_at:
                          type: string
                          format: date-time
                          example: 2025-11-12T03:33:49.974Z
                        updated_at:
                          type: string
                          format: date-time
                          example: 2025-11-12T03:33:49.974Z
        '400':
          description: 잘못된 요청
        '401':
          description: 인증 토큰이 필요합니다.
        '403':
          description: 해당 강좌에 접근할 수 없습니다.
        '404':
          description: 강좌를 찾을 수 없습니다.
        '500':
          description: 서버 오류
