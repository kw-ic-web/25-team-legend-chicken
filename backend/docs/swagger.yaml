                  questions_analyzed:
                    type: number
                    example: 4
                  questions:
                    type: array
                    items:
                      type: object
                      properties:
                        student_name:
                          type: string
                          example: 김학생
                        question:
                          type: string
                          example: 파이썬 기초에 대해 제가 이해한 게 맞는지 확인하고 싶습니다.
                        timestamp:
                          type: string
                          format: date-time
                  report:
                    type: object
                    properties:
                      summary:
                        type: string
