  /api/lectures/{lectureId}/classes/{classId}/whiteboard/upload-pdf:
    post:
      tags: [Whiteboard, Working]
      summary: PDF 업로드 및 분할
      description: PDF 파일을 업로드하고 페이지별로 분할하여 저장합니다. 각 페이지는 OCR을 통해 텍스트를 추출합니다.
      security:
        - bearerAuth: []
      parameters:
        - name: lectureId
          in: path
          required: true
          schema:
            type: string
          example: LEC-32AEBA14
        - name: classId
          in: path
          required: true
          schema:
            type: number
          example: 2
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [pdf]
              properties:
                pdf:
                  type: string
                  format: binary
                  description: PDF 파일
      responses:
        '201':
          description: PDF 업로드 및 분할 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: PDF가 업로드되었고, 내부적으로 페이지별 분할 저장되었습니다.
                  lecture_id:
                    type: string
                    example: LEC-32AEBA14
                  class_id:
                    type: number
                    example: 2
                  total_pages:
                    type: number
                    example: 10
                  pages:
                    type: array
                    items:
                      type: object
                      properties:
                        page_number:
                          type: number
                          example: 1
                        image_path:
                          type: string
                          example: /uploads/pdfs/pdf-1763312325706-187817688.pdf
                        pdf_path:
                          type: string
                          example: /uploads/pdfs/pdf-1763312325706-187817688.pdf
                        text:
                          type: string
                          example: "웹서비스 기초\nRESTful API 설계..."
                        status:
                          type: string
                          enum: [finalized]
                          example: finalized
                  materials_count:
                    type: number
                    example: 1
                  original_pdf_url:
                    type: string
                    example: /uploads/pdfs/pdf-1763312325706-187817688.pdf
        '400':
          description: 잘못된 요청 (PDF 파일 미업로드)
        '403':
          description: 권한 없음 (교수만 가능)
