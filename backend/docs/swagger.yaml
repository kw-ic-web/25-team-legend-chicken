        '201':
          description: 채팅 메시지 전송 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: sent
                  data:
                    type: object
                    description: 저장된 채팅 메시지
        '422':
          description: 필수 필드 누락
        '403':
