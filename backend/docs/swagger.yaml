openapi: 3.0.0
info:
  title: Lec-Q API
  description: Lec-Q 강의 관리 시스템 API 문서
  version: 1.0.0
  contact:
    name: Hyunwoo Park

servers:
  - url: http://localhost:8080
    description: 로컬 개발 서버

tags:
  - name: Auth
    description: 인증 관련 API
  - name: Professor
    description: 교수 관련 API
  - name: Student
    description: 학생 관련 API
  - name: Lectures
    description: 강의 공통 API
  - name: Whiteboard
    description: 실시간 화이트보드 캡처 API
  - name: Questions
    description: 질문 관련 API
  - name: Reports
    description: 분석 리포트 API
  - name: Working
    description: 지금 연결해야하는 API
  - name: Chat
    description: 실시간 채팅 API

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: 에러 메시지
    
    Class:
      type: object
      properties:
        id:
          type: number
          example: 1
        title:
          type: string
          example: 파이썬 기초
        description:
          type: string
          example: 파이썬 문법과 기본 개념
        date:
          type: string
          format: date-time
          example: 2024-01-15T10:00:00.000Z
        materials:
          type: array
          items:
            type: string
          example: ["https://example.com/python-basic.pdf"]
    
    Reference:
      type: object
      properties:
        title:
          type: string
          example: 파이썬 프로그래밍
        author:
          type: string
          example: 홍길동
        publisher:
          type: string
          example: 한빛미디어
    
    Lecture:
      type: object
      properties:
        lecture_id:
          type: string
          example: LEC-A2787F9D
        name:
          type: string
          example: 파이썬 프로그래밍
        schedule:
          type: string
          example: 월수금 10:00-12:00
        student_count:
          type: number
          example: 30
        professor_name:
          type: string
          example: 홍길동
        professor_email:
          type: string
          example: professor@example.com
        professor_phone:
          type: string
          example: 010-1234-5678
        lecture_description:
          type: string
          example: 파이썬 기초부터 고급까지
        learning_method:
          type: string
          example: 이론 + 실습
        target_audience:
          type: string
          example: 컴퓨터공학 전공자
        references:
          type: array
          items:
            $ref: '#/components/schemas/Reference'
        classes:
          type: array
          items:
            $ref: '#/components/schemas/Class'
        thumbnail:
          type: string
          example: /uploads/images/thumbnail-1234567890-123456789.jpg
        professor_id:
          type: string
        student_id_list:
          type: array
          items:
            type: string

    WhiteboardPage:
      type: object
      properties:
        page_number:
          type: number
          example: 1
        image_path:
          type: string
          example: /uploads/whiteboard/snapshot-1700000000000-123456789.png
        text:
          type: string
          example: "for loop, while loop 정리"
        pdf_path:
          type: string
          example: /uploads/pdfs/whiteboard/whiteboard-LEC-123-CLASS1-p1-1700000000000.pdf
        status:
          type: string
          enum: [draft, finalized]

paths:
  # ==================== 인증 API ====================
  /api/register:
    post:
      tags: [Auth]
      summary: 회원가입
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, user_type]
              properties:
                name:
                  type: string
                  example: 홍길동
                email:
                  type: string
                  format: email
                  example: professor123@test.com
                phone:
                  type: string
                  example: 010-1234-5678
                password:
                  type: string
                  format: password
                  example: test1234
                user_type:
                  type: string
                  enum: [professor, student]
                  example: professor
      responses:
        '201':
          description: 회원가입 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 회원가입이 완료되었습니다.
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      name:
                        type: string
                      user_type:
                        type: string
        '400':
          description: 잘못된 요청
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/login:
    post:
      tags: [Auth]
      summary: 로그인
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: professor@test.com
                password:
                  type: string
                  format: password
                  example: test1234
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 로그인 성공!
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      name:
                        type: string
                      user_type:
                        type: string
                  token:
                    type: string
                    description: JWT 토큰
        '401':
          description: 인증 실패
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: false
                  message:
                    type: string
                    example: 존재하지 않는 이메일입니다.

  /api/verify:
    get:
      tags: [Auth]
      summary: 토큰 검증
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 유효한 토큰
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: number
                    example: 200
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 유효한 토큰입니다.
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      email:
                        type: string
                      name:
                        type: string
                      user_type:
                        type: string
        '401':
          description: 유효하지 않은 토큰
        '419':
          description: 토큰 만료

  /api/logout:
    post:
      tags: [Auth]
      summary: 로그아웃
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 로그아웃 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 로그아웃이 완료되었습니다.
        '401':
          description: 인증 토큰이 필요합니다.
        '403':
          description: 유효하지 않은 토큰
        '500':
          description: 서버 오류

  /api/myinfo:
    get:
      tags: [Auth]
      summary: 내 정보 조회
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 내 정보 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      email:
                        type: string
                      phone:
                        type: string
                      user_type:
                        type: string
                      profile_image:
                        type: string
                        example: /uploads/images/profile_image-1234567890-123456789.jpg
        '401':
          description: 인증 토큰이 필요합니다.
        '404':
          description: 사용자를 찾을 수 없습니다.

    put:
      tags: [Auth]
      summary: 내 정보 수정
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: 홍길동
                email:
                  type: string
                  format: email
                  example: professor@test.com
                phone:
                  type: string
                  example: 010-1234-5678
                password:
                  type: string
                  format: password
                  example: newpassword123
                profile_image:
                  type: string
                  format: binary
                  description: 프로필 사진 (jpg, jpeg, png, gif, webp)
      responses:
        '200':
          description: 정보 수정 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 정보가 성공적으로 수정되었습니다.
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      email:
                        type: string
                      phone:
                        type: string
                      user_type:
                        type: string
                      profile_image:
                        type: string
        '401':
          description: 인증 토큰이 필요합니다.
        '404':
          description: 사용자를 찾을 수 없습니다.
        '500':
          description: 서버 오류

  # ==================== 교수 API ====================
  /api/professor/lectures/create:
    post:
      tags: [Professor]
      summary: 강좌 개설
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: 파이썬 프로그래밍
                schedule:
                  type: string
                  example: 월수금 10:00-12:00
                student_count:
                  type: number
                  example: 30
                professor_name:
                  type: string
                  example: 홍길동
                professor_email:
                  type: string
                  example: professor@example.com
                professor_phone:
                  type: string
                  example: 010-1234-5678
                lecture_description:
                  type: string
                  example: 파이썬 기초부터 고급까지
                learning_method:
                  type: string
                  example: 이론 + 실습
                target_audience:
                  type: string
                  example: 컴퓨터공학 전공자
                references:
                  type: string
                  description: JSON 문자열 또는 JSON 배열
                  example: '[{"title":"파이썬 프로그래밍","author":"홍길동","publisher":"한빛미디어"}]'
                classes:
                  type: string
                  description: JSON 문자열 또는 JSON 배열
                  example: '[{"id":1,"title":"파이썬 기초","description":"파이썬 문법과 기본 개념","date":"2024-01-15T10:00:00.000Z","materials":[]}]'
                thumbnail:
                  type: string
                  format: binary
                  description: 강의 썸네일 이미지 (jpg, jpeg, png, gif, webp)
      responses:
        '201':
          description: 강의 개설 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 강의가 성공적으로 개설되었습니다.
                  lecture:
                    $ref: '#/components/schemas/Lecture'
        '403':
          description: 권한 없음
        '500':
          description: 서버 오류

  /api/professor/lectures/search:
    get:
      tags: [Professor]
      summary: 강좌 조회
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 강의 목록 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  lectures:
                    type: array
                    items:
                      $ref: '#/components/schemas/Lecture'
        '403':
          description: 권한 없음

  /api/professor/lectures/{lectureId}/check_member:
    get:
      tags: [Professor]
      summary: 강좌 멤버 조회
      security:
        - bearerAuth: []
      parameters:
        - name: lectureId
          in: path
          required: true
          schema:
            type: string
          example: LEC-D00C967D
      responses:
        '200':
          description: 멤버 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  lecture_id:
                    type: string
                    example: LEC-D00C967D
                  lecture_name:
                    type: string
                    example: 인공지능 기초
                  student_count:
                    type: number
                    example: 0
                  max_students:
                    type: number
                    example: 30
                  students:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        email:
                          type: string
                        phone:
                          type: string
                  invite_link:
                    type: string
                    example: http://localhost:3000/join-lecture/LEC-D00C967D
        '403':
          description: 권한 없음
        '404':
          description: 강좌를 찾을 수 없음

  /api/professor/lectures/{lectureId}/invite_student:
    post:
      tags: [Professor]
      summary: 학생 초대 (이메일)
      security:
        - bearerAuth: []
      parameters:
        - name: lectureId
          in: path
          required: true
          schema:
            type: string
          example: LEC-A1B2C3D4
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [student_email]
              properties:
                student_email:
                  type: string
                  format: email
                  example: student@example.com
      responses:
        '200':
          description: 학생 초대 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 학생이 성공적으로 초대되었습니다.
                  student:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      email:
                        type: string
                  current_count:
                    type: number
                    example: 1
                  max_count:
                    type: number
                    example: 30
        '400':
          description: 잘못된 요청
        '403':
          description: 권한 없음
        '404':
          description: 강좌 또는 학생을 찾을 수 없음

  /api/professor/lectures/{lectureId}/classes:
    get:
      tags: [Professor]
      summary: 클래스 목록 조회
      security:
        - bearerAuth: []
      parameters:
        - name: lectureId
          in: path
          required: true
          schema:
            type: string
          example: LEC-A2787F9D
      responses:
        '200':
          description: 클래스 목록 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  lecture_id:
                    type: string
                  lecture_name:
                    type: string
                  classes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Class'
        '403':
          description: 권한 없음
        '404':
          description: 강좌를 찾을 수 없음

    put:
      tags: [Professor, Working]
      summary: 클래스 수정
      security:
        - bearerAuth: []
      parameters:
        - name: lectureId
          in: path
          required: true
          schema:
            type: string
          example: LEC-A2787F9D
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [classes]
              properties:
                classes:
                  type: array
                  items:
                    $ref: '#/components/schemas/Class'
                  example:
                    - id: 1
                      title: 파이썬 기초 (수정됨)
                      description: 파이썬 문법과 기본 개념 - 업데이트
                      date: 2024-01-15T10:00:00Z
                      materials: ["https://example.com/python-basic-v2.pdf"]
                    - id: 2
                      title: 반복문과 리스트
                      description: for, while 반복문과 리스트 조작
                      date: 2024-01-17T10:00:00Z
                      materials: ["https://example.com/loops-lists.pdf"]
      responses:
        '200':
          description: 클래스 수정 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 클래스가 성공적으로 수정되었습니다.
                  lecture_id:
                    type: string
                  classes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Class'
        '400':
          description: 잘못된 요청
        '403':
          description: 권한 없음
        '404':
          description: 강좌를 찾을 수 없음

    post:
      tags: [Professor]
      summary: 클래스 추가
      description: 새로운 클래스를 추가합니다. 다음 class 번호가 자동으로 할당됩니다.
      security:
        - bearerAuth: []
      parameters:
        - name: lectureId
          in: path
          required: true
          schema:
            type: string
          example: LEC-A2787F9D
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  example: 새로운 클래스
                description:
                  type: string
                  example: 클래스 설명
                date:
                  type: string
                  format: date-time
                  example: 2025-01-20T10:00:00Z
                materials:
                  type: array
                  items:
                    type: string
                  example: []
      responses:
        '201':
          description: 클래스 추가 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 클래스가 성공적으로 추가되었습니다.
                  lecture_id:
                    type: string
                    example: LEC-A2787F9D
                  class:
                    $ref: '#/components/schemas/Class'
        '400':
          description: 잘못된 요청
        '403':
          description: 권한 없음 (교수만 가능)
        '404':
          description: 강좌를 찾을 수 없음
        '500':
          description: 서버 오류

  /api/professor/lectures/{lectureId}/classes/{classId}:
    get:
      tags: [Professor]
      summary: 특정 클래스 정보 조회
      security:
        - bearerAuth: []
      parameters:
        - name: lectureId
          in: path
          required: true
          schema:
            type: string
          example: LEC-A2787F9D
        - name: classId
          in: path
          required: true
          schema:
            type: number
          example: 1
      responses:
        '200':
          description: 클래스 정보 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  lecture_id:
                    type: string
                    example: LEC-A2787F9D
                  lecture_name:
                    type: string
                    example: 파이썬 프로그래밍
                  class:
                    $ref: '#/components/schemas/Class'
        '403':
          description: 권한 없음
        '404':
          description: 강좌 또는 클래스를 찾을 수 없음

    delete:
      tags: [Professor, Working]
      summary: 클래스 삭제
      description: 특정 클래스를 삭제합니다.
      security:
        - bearerAuth: []
      parameters:
        - name: lectureId
          in: path
          required: true
          schema:
            type: string
          example: LEC-A2787F9D
        - name: classId
          in: path
          required: true
          schema:
            type: number
          example: 1
      responses:
        '200':
          description: 클래스 삭제 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: 클래스가 성공적으로 삭제되었습니다.
                  lecture_id:
                    type: string
                    example: LEC-A2787F9D
                  deleted_class:
                    $ref: '#/components/schemas/Class'
        '403':
          description: 권한 없음 (교수만 가능)
        '404':
          description: 강좌 또는 클래스를 찾을 수 없음
        '500':
          description: 서버 오류

  /api/professor/lectures/{lectureId}/classes/{classId}/pdf:
    get:
      tags: [Professor]
      summary: 특정 클래스의 PDF 목록 조회
      security:
        - bearerAuth: []
      parameters:
        - name: lectureId
          in: path
          required: true
          schema:
            type: string
          example: LEC-A2787F9D
        - name: classId
          in: path
          required: true
          schema:
            type: number
          example: 1
      responses:
        '200':
          description: PDF 목록 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  lecture_id:
                    type: string
                    example: LEC-A2787F9D
                  lecture_name:
                    type: string
                    example: 파이썬 프로그래밍
                  class_id:
                    type: number
                    example: 1
                  class_title:
                    type: string
                    example: 파이썬 기초
                  pdf_count:
                    type: number
